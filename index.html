<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional profile and CV of Gerasimos Despotakis" />
  <title>Gerasimos Despotakis | Professional Card & CV</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.05;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: clamp(16px, 3.5vw, 21px);
      color: #4b5563;
      font-weight: 600;
    }
    .details {
      max-width: 650px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
      text-align: left;
    }
    .row {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .label {
      font-weight: 700;
      display: inline-block;
      min-width: 110px;
    }
    a {
      color: #111827;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    a:hover { opacity: .75; }
    .buttons {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .button {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    .button.secondary {
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .cv-section {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .cv-head {
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .cv-head h2 {
      margin: 0;
      font-size: 22px;
    }
    .pdf-frame {
      width: 100%;
      height: 1100px;
      border: 0;
      display: block;
      background: #e5e7eb;
    }
    .fallback {
      padding: 24px;
      text-align: center;
    }
    @media (max-width: 700px) {
      .wrap { padding: 12px 10px 28px; }
      .card { padding: 24px 16px; border-radius: 14px; }
      .label { min-width: 0; display: block; margin-bottom: 4px; }
      .pdf-frame { height: 78vh; min-height: 620px; }
      .cv-section { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Professional card">
      <h1>Gerasimos Despotakis</h1>
      <p class="subtitle">MSc in Marketing &amp; Brand Management (Oxford Brookes University)</p>

      <div class="details">
        <div class="row">
          <span class="label">Phone</span>
          <a href="tel:+306951105525">+30 695 110 5525</a>
        </div>
        <div class="row">
          <span class="label">Email</span>
          <a href="mailto:max.despotakis@gmail.com">max.despotakis@gmail.com</a>
        </div>
        <div class="row">
          <span class="label">Location</span>
          Athens, Greece
        </div>
        <div class="row">
          <span class="label">LinkedIn</span>
          <a href="https://www.linkedin.com/in/gerasimos-despotakis-844451148"
             target="_blank" rel="noopener noreferrer">Gerasimos Despotakis</a>
        </div>
      </div>

      <div class="buttons">
        <a class="button" href="Gerasimos_Despotakis.vcf" download>Save Contact</a>
        <a class="button secondary" href="Gerasimos_Despotakis_CV.pdf" target="_blank">Open CV</a>
      </div>
    </section>

    <section class="cv-section" aria-label="My CV">
      <div class="cv-head">
        <h2>My CV</h2>
        <a class="button secondary" href="Gerasimos_Despotakis_CV.pdf" download>Download CV</a>
      </div>

      <object class="pdf-frame"
              data="Gerasimos_Despotakis_CV.pdf#view=FitH"
              type="application/pdf">
        <div class="fallback">
          <p>Your browser cannot display the CV directly.</p>
          <p><a class="button" href="Gerasimos_Despotakis_CV.pdf" target="_blank">View CV</a></p>
        </div>
      </object>
    </section>
  </main>
</body>
</html>
